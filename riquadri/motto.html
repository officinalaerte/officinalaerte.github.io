<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Il motto latino del giorno · Officina Laerte</title><style>*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.45 Georgia,'Times New Roman',serif;color:#222;background:#fffdf6}.w{border:1px solid #d8d2c4;border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;min-height:120px}.w h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 3px;color:#555;font-weight:normal}.w p{margin:2px 0}.w .t{font-size:18px;font-weight:bold}.w .s{font-size:13px;color:#555}.w a{color:#1d2b4f}.by{font-size:11px;margin-top:5px}svg{flex:none;width:64px;height:64px}</style></head><body><div class="w"><div><h1>Il motto latino del giorno</h1><p class="t"><a id="l" target="_blank" rel="noopener"></a></p><p id="tr"></p><p class="s" id="s"></p><p class="by"><a href="https://officinalaerte.github.io/motti-latini/" target="_blank" rel="noopener">Motti latini di Officina Laerte</a></p></div></div><script>(function(){var M=[["Carpe diem","Cogli l'attimo","Vivi il presente, senza rimandare a un domani incerto.","carpe-diem"],["Alea iacta est","Il dado è tratto","La decisione è presa: non si torna indietro.","alea-iacta-est"],["Veni, vidi, vici","Venni, vidi, vinsi","Una vittoria rapida e completa.","veni-vidi-vici"],["Memento mori","Ricordati che devi morire","La vita è breve: vivila con consapevolezza.","memento-mori"],["Si vis pacem, para bellum","Se vuoi la pace, prepara la guerra","Chi è pronto a difendersi scoraggia chi vorrebbe attaccarlo.","si-vis-pacem-para-bellum"],["Audentes fortuna iuvat","La fortuna aiuta gli audaci","Chi osa ha più probabilità di riuscire.","audentes-fortuna-iuvat"],["Homo homini lupus","L'uomo è un lupo per l'uomo","Gli uomini sanno essere i peggiori nemici di se stessi.","homo-homini-lupus"],["Mens sana in corpore sano","Mente sana in corpo sano","Il benessere del corpo e quello della mente vanno insieme.","mens-sana-in-corpore-sano"],["Dura lex, sed lex","La legge è dura, ma è la legge","Anche una norma severa va rispettata.","dura-lex-sed-lex"],["Divide et impera","Dividi e comanda","Chi separa gli avversari li controlla più facilmente.","divide-et-impera"],["Omnia vincit amor","L'amore vince tutto","Nessun ostacolo resiste all'amore.","omnia-vincit-amor"],["Verba volant, scripta manent","Le parole volano, gli scritti restano","Ciò che è scritto dura nel tempo e fa fede.","verba-volant-scripta-manent"],["In vino veritas","Nel vino la verità","Chi beve tende a dire quello che pensa davvero.","in-vino-veritas"],["Per aspera ad astra","Attraverso le asperità, fino alle stelle","Le grandi mete si raggiungono superando le difficoltà.","per-aspera-ad-astra"],["Sapere aude","Abbi il coraggio di sapere","Usa la tua intelligenza, senza paura.","sapere-aude"],["Fortes fortuna adiuvat","La fortuna aiuta i forti","La determinazione attira le occasioni favorevoli.","fortes-fortuna-adiuvat"],["Fugit irreparabile tempus","Il tempo fugge irreparabilmente","Il tempo perduto non si recupera.","fugit-irreparabile-tempus"],["Quod erat demonstrandum","Come volevasi dimostrare","Formula che chiude una dimostrazione riuscita.","quod-erat-demonstrandum"],["Nemo propheta in patria","Nessuno è profeta in patria","È difficile essere apprezzati da chi ci conosce da sempre.","nemo-propheta-in-patria"],["De gustibus non disputandum est","Sui gusti non si discute","Le preferenze personali non si mettono in discussione.","de-gustibus-non-disputandum-est"],["Repetita iuvant","Le cose ripetute giovano","Ripetere aiuta a capire e ricordare.","repetita-iuvant"],["Nihil sub sole novum","Niente di nuovo sotto il sole","Tutto, in fondo, è già accaduto.","nihil-sub-sole-novum"],["Fiat lux","Sia la luce","L'inizio di ogni cosa; un'idea che illumina.","fiat-lux"],["Labor omnia vincit improbus","Il lavoro ostinato vince ogni cosa","Con l'impegno costante si supera ogni ostacolo.","labor-omnia-vincit-improbus"],["Quidquid agis, prudenter agas et respice finem","Qualunque cosa tu faccia, falla con prudenza e guarda alla fine","Agisci pensando alle conseguenze.","quidquid-agis-prudenter-agas-et-respice-finem"],["Roma locuta, causa finita","Roma ha parlato, la questione è chiusa","Quando decide l'autorità, non si discute più.","roma-locuta-causa-finita"],["Acta est fabula","La commedia è finita","È tutto concluso; cala il sipario.","acta-est-fabula"],["Si vis amari, ama","Se vuoi essere amato, ama","L'amore si riceve donandolo.","si-vis-amari-ama"],["Dum spiro, spero","Finché respiro, spero","Finché c'è vita, c'è speranza.","dum-spiro-spero"],["Faber est suae quisque fortunae","Ognuno è artefice della propria sorte","Il futuro dipende soprattutto dalle nostre scelte.","faber-est-suae-quisque-fortunae"],["Non omnis moriar","Non morirò del tutto","Le opere sopravvivono a chi le ha create.","non-omnis-moriar"],["Nil difficile volenti","Nulla è difficile per chi vuole","La volontà rende possibile ciò che sembra arduo.","nil-difficile-volenti"],["Sic transit gloria mundi","Così passa la gloria del mondo","Fama e potere sono destinati a svanire.","sic-transit-gloria-mundi"],["Pecunia non olet","Il denaro non ha odore","Il denaro vale lo stesso, qualunque sia la sua origine.","pecunia-non-olet"],["Ad maiora","Verso cose più grandi","Augurio di successi sempre maggiori.","ad-maiora"],["Ubi maior, minor cessat","Dove c'è il maggiore, il minore si fa da parte","Davanti a chi conta di più, gli altri cedono il passo.","ubi-maior-minor-cessat"],["Barba non facit philosophum","La barba non fa il filosofo","L'apparenza non basta a fare la sostanza.","barba-non-facit-philosophum"],["Nunc est bibendum","Ora bisogna bere","È il momento di festeggiare.","nunc-est-bibendum"],["Cui prodest?","A chi giova?","Per capire un fatto, chiediti chi ne trae vantaggio.","cui-prodest"],["Aut Caesar, aut nihil","O Cesare, o niente","Puntare al massimo, senza vie di mezzo.","aut-caesar-aut-nihil"],["Condicio sine qua non","Condizione senza la quale non","Un requisito indispensabile.","condicio-sine-qua-non"],["Ex nihilo nihil fit","Dal nulla non nasce nulla","Ogni risultato ha una causa e richiede un impegno.","ex-nihilo-nihil-fit"],["O tempora, o mores!","O tempi, o costumi!","Lamento per il declino dei costumi del proprio tempo.","o-tempora-o-mores"],["Felix culpa","Colpa felice","Un errore da cui nasce qualcosa di buono.","felix-culpa"],["Ab uno disce omnes","Da uno impara a conoscerli tutti","Un solo esempio può rivelare un intero gruppo.","ab-uno-disce-omnes"],["Quot capita, tot sententiae","Quante teste, tanti pareri","Ognuno ha la sua opinione.","quot-capita-tot-sententiae"],["Amicus certus in re incerta cernitur","L'amico sicuro si riconosce nella sorte incerta","I veri amici si vedono nel momento del bisogno.","amicus-certus-in-re-incerta-cernitur"],["Panem et circenses","Pane e giochi del circo","Il popolo sazio e distratto non protesta.","panem-et-circenses"],["Pacta sunt servanda","I patti vanno rispettati","Gli accordi presi devono essere onorati.","pacta-sunt-servanda"],["Qui tacet consentire videtur","Chi tace sembra acconsentire","Il silenzio può valere come un sì.","qui-tacet-consentire-videtur"],["Citius, altius, fortius","Più veloce, più in alto, più forte","Il motto olimpico: migliorarsi sempre.","citius-altius-fortius"],["Ubi bene, ibi patria","Dove si sta bene, lì è la patria","Casa è dove ci si sente bene.","ubi-bene-ibi-patria"],["Sub rosa","Sotto la rosa","In segreto, in via confidenziale.","sub-rosa"],["Primus inter pares","Primo tra pari","Chi guida un gruppo restando uno del gruppo.","primus-inter-pares"],["Mala tempora currunt","Corrono brutti tempi","Si attraversa un periodo difficile.","mala-tempora-currunt"],["Cave canem","Attenti al cane","L'avviso sulle porte delle case romane; un invito alla prudenza.","cave-canem"],["Hic et nunc","Qui e ora","Subito, senza rimandare.","hic-et-nunc"],["Ignorantia legis non excusat","L'ignoranza della legge non scusa","Non conoscere una regola non giustifica chi la viola.","ignorantia-legis-non-excusat"],["Testis unus, testis nullus","Un testimone solo, nessun testimone","Una sola prova non basta.","testis-unus-testis-nullus"],["Post tenebras lux","Dopo le tenebre, la luce","Dopo i momenti bui torna la speranza.","post-tenebras-lux"],["Corruptio optimi pessima","La corruzione del migliore è la peggiore","Quando si guasta ciò che era ottimo, il danno è massimo.","corruptio-optimi-pessima"],["Ars longa, vita brevis","L'arte è lunga, la vita è breve","Imparare richiede tempo, e il tempo è poco.","ars-longa-vita-brevis"],["Honoris causa","A titolo d'onore","Riconoscimento conferito per meriti speciali.","honoris-causa"],["Si tacuisses, philosophus mansisses","Se avessi taciuto, saresti rimasto filosofo","A volte il silenzio è la scelta più saggia.","si-tacuisses-philosophus-mansisses"],["Amicus omnibus, amicus nemini","Amico di tutti, amico di nessuno","Chi vuole piacere a tutti non ha veri amici.","amicus-omnibus-amicus-nemini"],["Aquila non capit muscas","L'aquila non cattura mosche","Chi punta in alto non si cura delle piccolezze.","aquila-non-capit-muscas"],["Semper fidelis","Sempre fedele","Lealtà senza condizioni.","semper-fidelis"],["Qui scribit, bis legit","Chi scrive legge due volte","Scrivere aiuta a capire e a ricordare.","qui-scribit-bis-legit"],["Lupus in fabula","Il lupo nella favola","Si dice quando arriva proprio la persona di cui si parlava.","lupus-in-fabula"],["Celerius quam asparagi cocuntur","Più in fretta di quanto si cuociano gli asparagi","In un attimo, rapidissimamente.","celerius-quam-asparagi-cocuntur"],["Ab imo pectore","Dal profondo del petto","Con assoluta sincerità.","ab-imo-pectore"],["Veritas liberabit vos","La verità vi farà liberi","Conoscere il vero rende liberi.","veritas-liberabit-vos"],["Omnia mea mecum porto","Porto con me tutti i miei beni","La vera ricchezza è quella interiore.","omnia-mea-mecum-porto"],["Nec plus ultra","Non più oltre","Il limite estremo; il meglio possibile.","nec-plus-ultra"],["Tertium non datur","Non è data una terza possibilità","O l'una o l'altra: non ci sono vie di mezzo.","tertium-non-datur"],["Natura non facit saltus","La natura non fa salti","In natura tutto procede per gradi.","natura-non-facit-saltus"],["Manus manum lavat","Una mano lava l'altra","Ci si aiuta a vicenda.","manus-manum-lavat"],["Gaudeamus igitur","Rallegriamoci, dunque","Canto goliardico che celebra la giovinezza.","gaudeamus-igitur"],["Nulla dies sine linea","Nessun giorno senza una linea","Un piccolo passo ogni giorno porta lontano.","nulla-dies-sine-linea"],["Quae nocent, docent","Le cose che nuocciono insegnano","Dagli sbagli e dai dolori si impara.","quae-nocent-docent"],["Non est vivere, sed valere vita est","La vita non è vivere, ma star bene","Conta la qualità della vita, non solo la durata.","non-est-vivere-sed-valere-vita-est"],["Ubi amor, ibi oculus","Dove c'è amore, lì c'è l'occhio","Chi ama è attento a ogni dettaglio.","ubi-amor-ibi-oculus"],["Mutatis mutandis","Cambiato ciò che va cambiato","Con i dovuti adattamenti.","mutatis-mutandis"],["Omne ignotum pro magnifico","Tutto ciò che è ignoto appare grandioso","Ciò che non conosciamo ci sembra più grande del vero.","omne-ignotum-pro-magnifico"],["Errando discitur","Sbagliando si impara","L'errore è parte dell'apprendimento.","errando-discitur"],["Noli me tangere","Non mi toccare","Parole di Gesù risorto; oggi indica qualcosa di intoccabile.","noli-me-tangere"],["Excusatio non petita, accusatio manifesta","Scusa non richiesta, accusa manifesta","Chi si giustifica senza motivo si tradisce.","excusatio-non-petita-accusatio-manifesta"],["Mens agitat molem","La mente muove la materia","È l'intelligenza a dare forma al mondo.","mens-agitat-molem"],["Nil mortalibus ardui est","Nulla è troppo arduo per i mortali","L'ingegno umano osa ogni impresa.","nil-mortalibus-ardui-est"],["Exegi monumentum aere perennius","Ho innalzato un monumento più duraturo del bronzo","Le opere dell'ingegno durano più di quelle materiali.","exegi-monumentum-aere-perennius"],["Suum cuique","A ciascuno il suo","Dare a ognuno ciò che gli spetta.","suum-cuique"],["Nullius in verba","Sulla parola di nessuno","Non credere per autorità: verifica.","nullius-in-verba"],["Do ut des","Do perché tu dia","Uno scambio basato sulla reciprocità.","do-ut-des"],["Errare humanum est, perseverare diabolicum","Sbagliare è umano, perseverare è diabolico","L'errore si perdona, ostinarsi no.","errare-humanum-est-perseverare-diabolicum"],["Festina lente","Affrettati lentamente","Agisci con rapidità, ma senza fretta sconsiderata.","festina-lente"],["Gutta cavat lapidem","La goccia scava la pietra","La costanza vince anche la resistenza più dura.","gutta-cavat-lapidem"],["Historia magistra vitae","La storia è maestra di vita","Il passato insegna come affrontare il presente.","historia-magistra-vitae"],["Mors tua, vita mea","Morte tua, vita mia","Il vantaggio dell'uno è lo svantaggio dell'altro.","mors-tua-vita-mea"],["Melius abundare quam deficere","Meglio abbondare che scarseggiare","Meglio avere qualcosa in più che in meno.","melius-abundare-quam-deficere"],["Motus in fine velocior","Il moto è più veloce alla fine","Le cose accelerano quando si avvicinano alla conclusione.","motus-in-fine-velocior"],["Nosce te ipsum","Conosci te stesso","La saggezza comincia dalla conoscenza di sé.","nosce-te-ipsum"],["Oderint, dum metuant","Mi odino, purché mi temano","Il motto di chi governa con la paura.","oderint-dum-metuant"],["Qui fugit molam, fugit farinam","Chi fugge la macina, fugge la farina","Senza fatica non c'è guadagno.","qui-fugit-molam-fugit-farinam"],["Rem tene, verba sequentur","Possiedi l'argomento, le parole verranno","Se sai cosa dire, le parole si trovano.","rem-tene-verba-sequentur"],["Similia similibus curantur","I simili si curano con i simili","Il rimedio può venire da ciò che ha causato il male.","similia-similibus-curantur"],["Tabula rasa","Tavoletta raschiata","Ripartire da zero, senza idee preconcette.","tabula-rasa"],["Timeo Danaos et dona ferentes","Temo i Greci anche quando portano doni","Diffida dei regali dei nemici.","timeo-danaos-et-dona-ferentes"],["Ut sementem feceris, ita metes","Come avrai seminato, così raccoglierai","Ogni azione porta i suoi frutti.","ut-sementem-feceris-ita-metes"],["Vae victis","Guai ai vinti","Chi perde è alla mercé del vincitore.","vae-victis"],["Vox populi, vox Dei","Voce di popolo, voce di Dio","L'opinione comune ha un peso enorme.","vox-populi-vox-dei"],["Sursum corda","In alto i cuori","Invito a farsi coraggio e a guardare avanti.","sursum-corda"],["Nemo dat quod non habet","Nessuno dà ciò che non ha","Non si può offrire ciò che non si possiede.","nemo-dat-quod-non-habet"],["Primum vivere, deinde philosophari","Prima vivere, poi filosofare","Prima le necessità concrete, poi le teorie.","primum-vivere-deinde-philosophari"],["Cogito, ergo sum","Penso, dunque sono","Il pensiero è la prova della propria esistenza.","cogito-ergo-sum"],["Unus pro omnibus, omnes pro uno","Uno per tutti, tutti per uno","Solidarietà reciproca in un gruppo.","unus-pro-omnibus-omnes-pro-uno"],["In medio stat virtus","La virtù sta nel mezzo","L'equilibrio sta lontano dagli eccessi.","in-medio-stat-virtus"],["Ora et labora","Prega e lavora","Equilibrio tra vita interiore e impegno quotidiano.","ora-et-labora"],["Otium cum dignitate","Riposo con dignità","Il tempo libero speso bene, con decoro.","otium-cum-dignitate"],["Omnia munda mundis","Tutto è puro per i puri","Chi ha l'animo limpido vede il bene ovunque.","omnia-munda-mundis"]],d=Math.floor((Date.now()+36e5)/864e5),m=M[(d*37)%M.length],$=function(i){return document.getElementById(i)};
$('l').textContent=m[0];$('l').href='https://officinalaerte.github.io/motti-latini/'+m[3]+'.html';$('tr').textContent='«'+m[1]+'»';$('s').textContent=m[2]})();</script></body></html>
